<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Digital-Analog Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="clock-container">
        <div class="ring" id="month-ring"></div>
        <div class="ring" id="day-ring"></div>
        <div class="ring" id="date-ring"></div>

        <div class="center-dial">
            <div class="digital-time" id="digital-clock">00:00:00</div>
            
            <div class="hand hour" id="hour-hand"></div>
            <div class="hand minute" id="min-hand"></div>
            <div class="hand second" id="sec-hand"></div>
            
            <div class="center-dot"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
